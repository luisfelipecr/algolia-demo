[project]
name = "algolia-demo"
version = "0.1.0"
description = "Agentic retail search demo in Brazilian Portuguese: Algolia storefront, VTEX connector and a merchandiser MCP server"
requires-python = ">=3.12"
dependencies = [
    "algoliasearch>=4.47.0",
    "mcp>=2.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["catalog/tests", "ingest/tests", "copiloto/tests", "evals/tests", "sintetico/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
